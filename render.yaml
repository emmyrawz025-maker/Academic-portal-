services:
  - type: web
    name: academic-portal
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn sms.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: sms-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
databases:
  - name: sms-db
    plan: free
